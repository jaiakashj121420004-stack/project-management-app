<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Single dynamic theme-color, kept in sync with the active theme by applyTheme(). -->
    <meta name="theme-color" content="#181210" id="theme-color" />
    <meta
      name="description"
      content="Aurora — a modern project-management app with boards, calendar, notes, and collaboration."
    />

    <!-- Open Graph / structured metadata — parsed programmatically by link-preview and
         verification crawlers (e.g. Google OAuth branding review), which read these
         tags directly rather than doing full-page text comprehension. Keep og:site_name
         and og:title in sync with the OAuth consent screen's configured app name ("Aurora"),
         and og:description in sync with meta[name=description] above. -->
    <meta property="og:site_name" content="Aurora" />
    <meta property="og:title" content="Aurora — one calm workspace for everything" />
    <meta
      property="og:description"
      content="Aurora, by Nvexis, is a modern project-management workspace: Kanban boards, a Notion-style block editor, an infinite collaborative canvas, a calendar, notes, and daily to-dos — installable on every device and synced in real time."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aurora.nvexis.com/" />

    <!-- Nvexis type: Fraunces (display) · Spectral (body) · IBM Plex Mono
         (figures/eyebrows, fixed) are self-hosted via @fontsource — see
         src/styles/fonts.css, imported from main.tsx — instead of a Google
         Fonts <link> here. Sora/Manrope, Playfair Display/Lora, and
         Poppins/Nunito are the four extra font-pairing choices offered in
         Settings (src/lib/customTheme.ts); those stay on the Google Fonts
         CDN below since most page loads never fetch them at all.

         Phase 7 Lighthouse audit (2026-08-23): a single render-blocking
         <link rel="stylesheet"> for all 10 families cost ~1.1s of blocked
         first paint on every visit, including anonymous landing-page visits
         that only ever use the first three. First fix (same date) split off
         a non-blocking preload-then-swap for the four optional pairing
         choices, leaving the three always-needed families as one small
         blocking Google Fonts request. Follow-up audit (n54opz6o92) measured
         that remaining request at ~750ms on mobile — almost entirely the
         round trip to a fresh third-party origin, not its ~2 KiB size — so
         it's now self-hosted instead of trimmed further: same three
         families, same weights/styles, zero extra network round-trip. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="optional-fonts-preload"
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!-- PWA icons — Aurora A-monogram (vector source: public/brand/aurora-*.svg) -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#7A2A26" />

    <!-- iOS standalone (home-screen) hints -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aurora" />

    <title>Aurora</title>
    <!-- Set the theme class before first paint to avoid a flash of the wrong theme.
         External (not inline) so the CSP can keep a strict `script-src 'self'`.
         Render-blocking in <head>, so it still runs before first paint. -->
    <script src="/theme-init.js"></script>
    <!-- Captures beforeinstallprompt before React ever mounts — see the file's
         header comment for why this can't just live inside a React hook.
         `defer` so it doesn't block first paint: the event it listens for can
         only fire well after the page is interactive, so there's no need to
         hold up rendering to attach the listener a few milliseconds earlier. -->
    <script src="/pwa-install-capture.js" defer></script>
    <!-- Activates the preloaded optional-fonts stylesheet above once it's
         downloaded, without an inline event handler (see the file itself). -->
    <script src="/font-swap.js" defer></script>
  </head>
  <body>
    <div id="root">
      <!--
        Static fallback content, visible only until React mounts and replaces it
        (createRoot overwrites these children on first render). Exists so that
        crawlers which don't execute JavaScript — e.g. Google OAuth branding
        verification — see real text describing the app, not an empty shell.
      -->
      <main style="font-family: Georgia, serif; max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; color: #ECE4D6; background: #181210;">
        <h1>Aurora</h1>
        <p>Aurora, by Nvexis, is a modern project-management workspace: Kanban boards, a
          Notion-style block editor, an infinite collaborative canvas, a calendar, notes,
          and daily to-dos — installable on every device and synced in real time.</p>
        <!-- If this static shell is still visible, the app's JavaScript hasn't
             taken over yet (slow network, or React failed to mount) — always
             give a way back to "/" so a deep link (e.g. /privacy or /terms)
             can never be a dead end while that's happening. -->
        <p><a href="/" style="color:#C24A40; font-weight:bold;">← Open Aurora</a></p>
        <p><a href="/privacy" style="color:#C24A40;">Privacy Policy</a> ·
           <a href="/terms" style="color:#C24A40;">Terms of Service</a></p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
